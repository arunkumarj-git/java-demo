<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Java DevOps Demo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .container {
            width: 90%;
            max-width: 900px;
            text-align: center;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            padding: 50px 30px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .subtitle {
            font-size: 20px;
            color: #cbd5e1;
            margin-bottom: 35px;
        }

        .status {
            display: inline-block;
            background: #16a34a;
            padding: 10px 25px;
            border-radius: 30px;
            font-weight: bold;
            margin-bottom: 35px;
        }

        .tools {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 15px;
            margin-top: 25px;
        }

        .tool {
            background: rgba(255, 255, 255, 0.12);
            padding: 20px;
            border-radius: 12px;
            font-weight: bold;
        }

        .footer {
            margin-top: 35px;
            color: #94a3b8;
            font-size: 14px;
        }

        .btn {
            display: inline-block;
            padding: 12px 25px;
            background: white;
            color: #1e3a8a;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 20px;
        }

        .btn:hover {
            background: #dbeafe;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>🚀 Java DevOps</h1>

        <p class="subtitle">
            Java Application Deployment Project
        </p>

        <div class="status">
            ● Application Running
        </div>

        <div class="tools">

            <div class="tool">☕ Java</div>
            <div class="tool">📦 Maven</div>
            <div class="tool">🐳 Docker</div>
            <div class="tool">☸ Kubernetes</div>
            <div class="tool">🔧 Jenkins</div>
            <div class="tool">☁️ AWS EC2</div>
            <div class="tool">🐙 GitHub</div>
            <div class="tool">📊 Grafana</div>

        </div>

        <a class="btn" href="/health">
            Check Health
        </a>

        <div class="footer">
            Java DevOps Demo • Deployed using CI/CD
        </div>

    </div>

</div>

</body>
</html>
